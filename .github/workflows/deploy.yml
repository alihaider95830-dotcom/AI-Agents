name: Deploy to Production

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: studio_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: studio/backend/requirements.txt

      - name: Install dependencies
        run: pip install -r studio/backend/requirements.txt

      - name: Run migrations
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:testpass@localhost:5432/studio_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-key-for-ci
          OPENAI_API_KEY: sk-test-fake-key-for-ci
          SUPABASE_URL: https://fake.supabase.co
          SUPABASE_ANON_KEY: fake-anon-key
          SUPABASE_SERVICE_KEY: fake-service-key
          STRIPE_SECRET_KEY: sk_test_fake
          STRIPE_WEBHOOK_SECRET: whsec_fake
          STRIPE_PRO_PRICE_ID: price_fake_pro
          STRIPE_AGENCY_PRICE_ID: price_fake_agency
          ADMIN_API_KEY: test-admin-key
          VECTOR_STORE_PATH: /tmp/faiss_test
          FRONTEND_URL: http://localhost:3000
          ENVIRONMENT: test
          ALLOWED_HOSTS: "*"
        run: |
          cd studio
          alembic upgrade head

      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:testpass@localhost:5432/studio_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-key-for-ci
          OPENAI_API_KEY: sk-test-fake-key-for-ci
          SUPABASE_URL: https://fake.supabase.co
          SUPABASE_ANON_KEY: fake-anon-key
          SUPABASE_SERVICE_KEY: fake-service-key
          STRIPE_SECRET_KEY: sk_test_fake
          STRIPE_WEBHOOK_SECRET: whsec_fake
          STRIPE_PRO_PRICE_ID: price_fake_pro
          STRIPE_AGENCY_PRICE_ID: price_fake_agency
          ADMIN_API_KEY: test-admin-key
          VECTOR_STORE_PATH: /tmp/faiss_test
          FRONTEND_URL: http://localhost:3000
          ENVIRONMENT: test
          ALLOWED_HOSTS: "*"
        run: |
          cd studio
          pytest backend/tests/ -v --tb=short

  test-frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.2

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: studio/frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: |
          cd studio/frontend
          pnpm install --frozen-lockfile

      - name: Run tests
        run: |
          cd studio/frontend
          pnpm test

      - name: Build check
        env:
          NEXT_PUBLIC_API_URL: https://api.example.com
          NEXT_PUBLIC_SUPABASE_URL: https://fake.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: fake-key
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_fake
        run: |
          cd studio/frontend
          pnpm build

  smoke-test:
    name: Smoke tests (production)
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install smoke dependencies
        run: pip install httpx pytest

      - name: Wait for production deploys
        run: sleep 60

      - name: Run smoke tests
        env:
          SMOKE_API_URL: ${{ secrets.PRODUCTION_API_URL }}
          SMOKE_FRONTEND_URL: ${{ secrets.PRODUCTION_FRONTEND_URL }}
          SMOKE_ADMIN_KEY: ${{ secrets.PRODUCTION_ADMIN_KEY }}
        run: pytest smoke_tests/ -v --tb=short
