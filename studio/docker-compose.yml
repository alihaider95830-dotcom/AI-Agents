services:
  postgres:
    image: pgvector/pgvector:pg16
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "6379:6379"

  backend:
    platform: linux/amd64
    build:
      context: ..
      dockerfile: studio/backend/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MODE: api
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis

  worker:
    platform: linux/amd64
    build:
      context: ..
      dockerfile: studio/workers/Dockerfile
    command: celery -A backend.workers.celery_app worker --beat --loglevel=info --queues=${CELERY_QUEUE_NAME:-studio_tasks}
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:
